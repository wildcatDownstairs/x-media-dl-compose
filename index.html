<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X 媒体下载</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --surface-hover: #1e1e1e;
      --border: rgba(255,255,255,0.16);
      --border-active: rgba(255,255,255,0.36);
      --text-primary: #f0f0f0;
      --text-secondary: #999;
      --text-muted: #555;
      --accent: #e7ff52;
      --accent-dim: rgba(231,255,82,0.12);
      --accent-text: #0a0a0a;
      --danger: #ff4d4d;
      --success: #52d68a;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --radius: 10px;
    }

    html { background: var(--bg); color: var(--text-primary); font-family: var(--sans); }

    body {
      min-height: 100vh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 40% at 50% -10%, rgba(231,255,82,0.06) 0%, transparent 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
    }

    /* ── top bar ── */
    .topbar {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 0;
      margin-bottom: 48px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-mark {
      width: 34px;
      height: 34px;
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      display: grid;
      place-items: center;
      letter-spacing: -1px;
    }
    .logo-name {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge {
      font-family: var(--mono);
      font-size: 10px;
      color: #cfcfcf;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 20px;
      padding: 5px 12px;
      letter-spacing: 0.04em;
    }

    /* ── hero ── */
    #homeView {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .hero-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .hero-title {
      font-size: clamp(32px, 7vw, 52px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .hero-title span {
      color: var(--accent);
    }
    .hero-sub {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* ── input card ── */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .input-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }
    .url-input {
      flex: 1;
      height: 52px;
      background: #050505;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 16px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }
    .url-input::placeholder { color: var(--text-muted); }
    .url-input:focus { border-color: var(--border-active); }

    .paste-btn {
      width: 52px;
      height: 52px;
      background: #050505;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-secondary);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .paste-btn:hover { border-color: var(--border-active); color: var(--text-primary); }
    .paste-btn svg { width: 18px; height: 18px; }

    .dl-btn {
      width: 100%;
      height: 52px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .dl-btn:hover { opacity: 0.88; }
    .dl-btn:active { transform: scale(0.98); }
    .dl-btn svg { width: 16px; height: 16px; }

    #homeMessage {
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 20px;
      font-family: var(--mono);
    }
    #homeMessage.err { color: var(--danger); }

    /* ── result view ── */
    #resultView {
      width: 100%;
      max-width: 680px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    #resultView.active { display: flex; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .result-header-left {}
    .result-eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    #resultTitle {
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #resultMeta {
      font-size: 12px;
      color: #b7b7b7;
      font-family: var(--mono);
      margin-top: 6px;
      line-height: 1.5;
    }
    .back-btn-top {
      flex-shrink: 0;
      height: 38px;
      padding: 0 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-secondary);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .back-btn-top:hover { border-color: var(--border-active); color: var(--text-primary); }

    /* status panel */
    #statusPanel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text strong { font-size: 14px; font-weight: 700; }
    .status-text p { font-size: 12px; color: var(--text-secondary); margin-top: 3px; font-family: var(--mono); }

    /* result content */
    #resultContent {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      max-width: 100%;
    }
    #resultContent:empty { display: none; }
    #resultContent .tw-video {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 14px;
      padding: 14px;
      align-items: start;
      max-width: 100%;
      overflow: hidden;
    }
    #resultContent .tw-left {
      grid-row: span 2;
      min-width: 0;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius);
      background: #050505;
    }
    #resultContent .tw-right { grid-column: 1 / -1; }
    #resultContent .tw-middle,
    #resultContent .thumbnail,
    #resultContent .image-tw {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }
    #resultContent img,
    #resultContent video {
      width: 100%;
      max-width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      display: block;
    }
    #resultContent .content h3 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    #resultContent .content p {
      color: var(--text-secondary);
      font-family: var(--mono);
      font-size: 13px;
    }
    #resultContent .dl-action {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    #resultContent .dl-action p { margin: 0; }
    #resultContent .dl-action a {
      min-height: 48px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--accent-text) !important;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    #resultContent .error {
      padding: 18px;
      color: var(--danger);
      font-family: var(--mono);
      font-size: 13px;
    }

    /* back / more btn */
    #bottomBackButton {
      width: 100%;
      height: 56px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: var(--radius);
      color: #d6d6d6;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      letter-spacing: 0.04em;
    }
    #bottomBackButton:hover {
      border-color: var(--border-active);
      color: var(--accent);
      background: rgba(231,255,82,0.06);
    }

    /* ── footer ── */
    .footer {
      margin-top: auto;
      padding: 32px 0 20px;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── util ── */
    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .topbar { margin-bottom: 32px; }
      #resultContent .tw-video { grid-template-columns: 1fr; }
      #resultContent .tw-left,
      #resultContent .tw-right { grid-column: auto; grid-row: auto; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="logo" href="#">
      <div class="logo-mark">X↓</div>
      <span class="logo-name">Media DL</span>
    </a>
    <span class="badge">Personal · Ad-free</span>
  </div>

  <!-- Home -->
  <section id="homeView">
    <p class="hero-label">// X Media Downloader</p>
    <h1 class="hero-title">Download<br/><span>without</span> the noise.</h1>
    <p class="hero-sub">Paste any X / Twitter post URL to grab videos and images directly — no ads, no redirects.</p>

    <div class="input-card">
      <span class="input-label">// Post URL</span>
      <div class="input-row">
        <input
          id="tweetUrl"
          class="url-input"
          type="url"
          placeholder="https://x.com/..."
          autocomplete="off"
          aria-label="帖子链接"
        />
        <button id="pasteButton" class="paste-btn" type="button" title="粘贴" aria-label="从剪贴板粘贴">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <path d="M8 10h8"></path><path d="M8 14h8"></path>
          </svg>
        </button>
      </div>
      <button id="resolveButton" class="dl-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        DOWNLOAD
      </button>
    </div>
    <p id="homeMessage" role="status"></p>
  </section>

  <!-- Result -->
  <section id="resultView">
    <div class="result-header">
      <div class="result-header-left">
        <p class="result-eyebrow">// 解析结果</p>
        <h2 id="resultTitle">选择要下载的媒体</h2>
        <p id="resultMeta" class="hidden"></p>
      </div>
    </div>

    <div id="statusPanel">
      <div class="spinner" aria-hidden="true"></div>
      <div class="status-text">
        <strong>正在解析…</strong>
        <p>请求代理 → 读取下载项</p>
      </div>
    </div>

    <div id="resultContent"></div>
    <button id="bottomBackButton" type="button">↩ Download more videos</button>
  </section>

  <footer class="footer">Personal use only · powered by savetwitter api</footer>

  <script>
    const homeView = document.querySelector("#homeView");
    const resultView = document.querySelector("#resultView");
    const tweetUrlInput = document.querySelector("#tweetUrl");
    const pasteButton = document.querySelector("#pasteButton");
    const resolveButton = document.querySelector("#resolveButton");
    const bottomBackButton = document.querySelector("#bottomBackButton");
    const homeMessage = document.querySelector("#homeMessage");
    const statusPanel = document.querySelector("#statusPanel");
    const resultContent = document.querySelector("#resultContent");
    const resultMeta = document.querySelector("#resultMeta");

    function setMessage(text, isError = false) {
      homeMessage.textContent = text;
      homeMessage.classList.toggle("err", isError);
    }

    function showHome() {
      resultView.classList.remove("active");
      resultView.classList.add("hidden");
      homeView.classList.remove("hidden");
      tweetUrlInput.value = "";
      setMessage("");
      resultMeta.textContent = "";
      resultMeta.classList.add("hidden");
      resultContent.innerHTML = "";
      tweetUrlInput.focus();
    }

    function showResultLoading() {
      homeView.classList.add("hidden");
      resultView.classList.remove("hidden");
      resultView.classList.add("active");
      statusPanel.classList.remove("hidden");
      resultMeta.classList.add("hidden");
      resultMeta.textContent = "";
      resultContent.innerHTML = "";
    }

    function normalizeSharedText(text) {
      const match = text.match(/https?:\/\/[^\s]+/i);
      return match ? match[0].replace(/[),.，。]+$/, "") : text.trim();
    }

    function looksLikeXUrl(value) {
      try {
        const url = new URL(value);
        return ["x.com", "twitter.com", "www.x.com", "www.twitter.com", "mobile.twitter.com"].includes(url.hostname);
      } catch {
        return false;
      }
    }

    function sanitizeResultHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = html;

      template.content.querySelectorAll("script, iframe, style, link, ins").forEach((node) => node.remove());
      template.content
        .querySelectorAll(".ads-slot-top, .adsbygoogle, .addthis-detail, .more-video, .action-convert")
        .forEach((node) => node.remove());

      template.content.querySelectorAll("*").forEach((node) => {
        [...node.attributes].forEach((attribute) => {
          const name = attribute.name.toLowerCase();
          if (name.startsWith("on") || name === "srcdoc") {
            node.removeAttribute(attribute.name);
          }
        });
      });

      const videoLinks = [...template.content.querySelectorAll("a[href]")]
        .filter((link) => /download\s*mp4/i.test(link.textContent))
        .map((link) => ({
          link,
          quality: Number(link.textContent.match(/\((\d+)p\)/i)?.[1] || 0),
        }));
      const bestVideo = videoLinks.sort((a, b) => b.quality - a.quality)[0]?.link;

      template.content.querySelectorAll("a[href]").forEach((link) => {
        const text = link.textContent.toLowerCase();
        const href = link.getAttribute("href") || "";
        if (href === "#" || text.includes("mp3")) {
          link.remove();
          return;
        }

        if (/download\s*mp4/i.test(link.textContent) && link !== bestVideo) {
          link.remove();
          return;
        }

        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      });

      template.content.querySelectorAll("p").forEach((paragraph) => {
        if (!paragraph.textContent.trim() && paragraph.children.length === 0) {
          paragraph.remove();
        }
      });

      return template.innerHTML;
    }

    function updateSummary(payload) {
      const summary = payload.summary || {};
      const types = [];
      if (summary.hasVideo) types.push("视频");
      if (summary.hasImage) types.push("图片");

      const parts = [];
      if (types.length) parts.push(types.join(" / "));
      if (typeof summary.mediaLinkCount === "number") parts.push(`${summary.mediaLinkCount} 个下载项`);
      if (payload.elapsedMs) parts.push(`${payload.elapsedMs} ms`);

      resultMeta.textContent = parts.join(" · ");
      resultMeta.classList.toggle("hidden", parts.length === 0);
    }

    async function resolveUrl(url) {
      showResultLoading();

      try {
        const response = await fetch("/api/resolve", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const payload = await response.json();

        statusPanel.classList.add("hidden");
        updateSummary(payload);

        if (!payload.ok) {
          resultContent.innerHTML = `<div class="error">${payload.message || "解析失败"}</div>`;
          return;
        }

        resultContent.innerHTML = sanitizeResultHtml(payload.html);
      } catch (error) {
        statusPanel.classList.add("hidden");
        resultContent.innerHTML = `<div class="error">${error instanceof Error ? error.message : "解析失败"}</div>`;
      }
    }

    async function pasteAndResolve() {
      setMessage("");

      if (!navigator.clipboard?.readText) {
        setMessage("当前浏览器不支持直接读取剪贴板，请手动粘贴。", true);
        tweetUrlInput.focus();
        return;
      }

      try {
        const text = await navigator.clipboard.readText();
        const url = normalizeSharedText(text);
        tweetUrlInput.value = url;

        if (!looksLikeXUrl(url)) {
          setMessage("剪贴板里没有 x.com 或 twitter.com 分享链接。", true);
          return;
        }

        await resolveUrl(url);
      } catch {
        setMessage("浏览器拒绝读取剪贴板，请点输入框手动粘贴。", true);
      }
    }

    async function resolveFromInput() {
      const url = normalizeSharedText(tweetUrlInput.value);
      tweetUrlInput.value = url;

      if (!looksLikeXUrl(url)) {
        setMessage("请粘贴 x.com 或 twitter.com 的公开帖子分享链接。", true);
        return;
      }

      await resolveUrl(url);
    }

    pasteButton.addEventListener("click", pasteAndResolve);
    resolveButton.addEventListener("click", resolveFromInput);
    bottomBackButton.addEventListener("click", showHome);
    tweetUrlInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        resolveFromInput();
      }
    });
  </script>
</body>
</html>
